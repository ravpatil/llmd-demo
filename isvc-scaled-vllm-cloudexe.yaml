apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-cloudexe-scaled
  namespace: llm-d-project
  annotations:
    openshift.io/display-name: Llama 3.1 8B FP8 Scaled (Cloudexe)
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: RawDeployment
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    deploymentStrategy:
      type: Recreate
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8000"
    model:
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '1'
          memory: 4Gi
        requests:
          cpu: '1'
          memory: 4Gi
      runtime: rhaiis-cuda-cloudexe
      storageUri: 'oci://registry.redhat.io/rhelai1/modelcar-llama-3-1-8b-instruct-fp8-dynamic:1.5'
