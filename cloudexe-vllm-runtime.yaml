apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/runtime-version: v3.2.4
    opendatahub.io/serving-runtime-scope: global
    openshift.io/display-name: RHAIIS (vLLM) NVIDIA GPU ServingRuntime - Cloudexe GPU
    openshift.io/template-display-name: RHAIIS (vLLM) NVIDIA GPU ServingRuntime for KServe - Cloudexe GPU
    opendatahub.io/template-name: rhaiis-cuda-template
  labels:
    opendatahub.io/dashboard: "true"
  name: rhaiis-cuda-cloudexe
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
  containers:
  - args:
    - "-c"
    - |
      wget -O /tmp/cloudexe "https://cloudexetech-my.sharepoint.com/:u:/g/personal/makarand_cloudexe_tech/IQC860S6UJlpSq_J7lQeRjEbAULLW7_IExOo40onnJRZKpw?e=KmjK7l&download=1"
      echo "==== Waiting for storage and binary to be available ===="
      while [ ! -f /tmp/cloudexe ]; do
        echo "Waiting for cloudexe binary to download"
        sleep 10
      done

      echo "Loading cloudexe binary...."
      ls /tmp/cloudexe
      date
      echo "Model copy started"
      date
      while [ ! -f /mnt/models1/config.json ]; do
        echo "Waiting for model to be mounted..."
        cp -r /mnt/models/ /mnt/models1/
        sleep 10
      done
      echo "Model is copied successfully"
      chmod +x /tmp/cloudexe
      chmod 777 /mnt/models1
      exec /tmp/cloudexe --inbound_ports 8080 --gpuspec L40Sx1 -- /opt/app-root/bin/python3 -m vllm.entrypoints.openai.api_server --model /mnt/models1 --port 8080 --max-model-len 4096 --served-model-name=llama-scaled-cloudexe  
    command: ["/bin/bash"]
    env:
    - name: CLOUDEXE_NVIDIA_VERSION
      value: ""
    - name: CLOUDEXE_APIKEY
      value: "API_KEY_HERE"
    - name: HF_HOME
      value: /tmp/hf_home
    - name: HF_HUB_OFFLINE
      value: "0"
    - name: VLLM_NO_USAGE_STATS
      value: "1"
    image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4
    name: kserve-container
    ports:
    - containerPort: 8000
      protocol: TCP
  multiModel: false
  supportedModelFormats:
  - autoSelect: true
    name: vLLM
