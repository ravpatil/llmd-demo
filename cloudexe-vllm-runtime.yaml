apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/runtime-version: v3.2.4
    opendatahub.io/serving-runtime-scope: global
    openshift.io/display-name: RHAIIS (vLLM) NVIDIA GPU ServingRuntime - Cloudexe GPU
    openshift.io/template-display-name: RHAIIS (vLLM) NVIDIA GPU ServingRuntime for KServe
    opendatahub.io/template-name: rhaiis-cuda-template
  labels:
    opendatahub.io/dashboard: "true"
  name: rhaiis-cuda-cloudexe
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
  - args:
    - "-c"
    - | 
      wget -O /tmp/cloudex "https://cloudexetech-my.sharepoint.com/:u:/g/personal/makarand_cloudexe_tech/IQC860S6UJlpSq_J7lQeRjEbAULLW7_IExOo40onnJRZKpw?e=KmjK7l&download=1" && \
      chmod +x /tmp/cloudexe && \
      export CLOUDEXE_NVIDIA_VERSION="" && \
      export CLOUDEXE_APIKEY="eyJleHBpcnlfZGF0ZSI6IjIwMjYtMDctMDkgMDM6MTc6MDAiLCJ1c2VyaWQiOiI0Njc5ZDYyNi1jZTc5LTQ2ZmItOGI5Mi0zYTQ5ZDliYTEzY2QifQ==.TCl6gcGAPxEkShCVRziN5dwoIZ_J1SsnMw-g47k9_YA=" && \
      /tmp/cloudex --inbound_ports 8000 --envname redhat_demo --gpuspec L40Sx1 -- \
      /opt/app-root/bin/python3 \
      -m vllm.entrypoints.openai.api_server \ 
      --model /mnt/models \
      --port 8000 --download-dir /models-cache --max-model-len 4096 --served-model-name={{.Name}}
    command: ["/bin/bash"]
    env:
    - name: HF_HOME
      value: /tmp/hf_home
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: VLLM_NO_USAGE_STATS
      value: "1"
    image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4
    name: kserve-container
    ports:
    - containerPort: 8000
      protocol: TCP
  multiModel: false
  supportedModelFormats:
  - autoSelect: true
    name: vLLM
